<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Outer Tech Globe Orbit Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="880" stroke-dashoffset="120" />

  <!-- Outer Orbital Nodes -->
  <circle cx="256" cy="71" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="441" cy="256" r="14" fill="#0284c7" filter="url(#glow)" />
  <circle cx="256" cy="441" r="14" fill="#2563eb" filter="url(#glow)" />
  <circle cx="71" cy="256" r="14" fill="#60a5fa" filter="url(#glow)" />

  <!-- Inner Globe Grid Lines -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.6" stroke-dasharray="12 8" />
  <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.6" stroke-dasharray="12 8" />

  <!-- Stylized G / Power Circuit Emblem in Center -->
  <path d="M 256 120 A 136 136 0 1 0 392 256 L 392 240 L 256 240 L 256 288 L 340 288 A 88 88 0 1 1 256 168 A 88 88 0 0 1 332 208 L 372 176 A 136 136 0 0 0 256 120 Z" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Center Power Lightning Spec Bolt -->
  <path d="M 270 180 L 220 260 L 260 260 L 240 330 L 300 240 L 260 240 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
